[project]
name = "family-finance-backend"
version = "0.1.0"
description = "Household finance backend"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.118,<1",
  "uvicorn[standard]>=0.37,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "httpx>=0.28,<1",
  "ruff>=0.13,<1",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
